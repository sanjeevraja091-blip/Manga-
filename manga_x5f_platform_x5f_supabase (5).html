-- Supabase Dashboard > SQL Editor > New query me paste karke RUN dabao.

-- 1) PROFILES = user/muser wali table (signup par auto-create hoti hai)
create table if not exists public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  email text,
  coins integer not null default 0,
  created_at timestamptz not null default now()
);

-- 2) manga
create table if not exists public.manga (
  id uuid primary key default gen_random_uuid(),
  title text not null,
  description text,
  cover_url text,
  image_url text,
  created_at timestamptz not null default now()
);

-- 2b) 18+ flag (purane setup par bhi chala sakte ho — sirf column add hoga)
alter table public.manga add column if not exists is_18plus boolean default false;

-- 3) chapters
create table if not exists public.chapters (
  id uuid primary key default gen_random_uuid(),
  manga_id uuid not null references public.manga(id) on delete cascade,
  chapter_number integer not null,
  title text,
  price numeric not null default 0,
  created_at timestamptz not null default now(),
  unique(manga_id, chapter_number)
);

-- 4) pages
create table if not exists public.pages (
  id uuid primary key default gen_random_uuid(),
  chapter_id uuid not null references public.chapters(id) on delete cascade,
  page_number integer not null,
  image_url text not null,
  created_at timestamptz not null default now(),
  unique(chapter_id, page_number)
);

-- 5) purchases (kis user ne kaunsa chapter unlock kiya)
create table if not exists public.purchases (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null references public.profiles(id) on delete cascade,
  chapter_id uuid not null references public.chapters(id) on delete cascade,
  created_at timestamptz not null default now(),
  unique(user_id, chapter_id)
);

-- 6) wallet_transactions (coins ka hisaab)
create table if not exists public.wallet_transactions (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null references public.profiles(id) on delete cascade,
  amount integer not null,
  kind text not null,
  note text,
  created_at timestamptz not null default now()
);

-- RLS on
alter table public.profiles enable row level security;
alter table public.manga enable row level security;
alter table public.chapters enable row level security;
alter table public.pages enable row level security;
alter table public.purchases enable row level security;
alter table public.wallet_transactions enable row level security;

-- purani policies ho to hatao (dobara run karne par error na aaye)
drop policy if exists "profiles read own" on public.profiles;
drop policy if exists "profiles update own" on public.profiles;
drop policy if exists "manga public read" on public.manga;
drop policy if exists "manga auth write" on public.manga;
drop policy if exists "chapters public read" on public.chapters;
drop policy if exists "chapters auth write" on public.chapters;
drop policy if exists "pages public read" on public.pages;
drop policy if exists "pages auth write" on public.pages;
drop policy if exists "purchases own read" on public.purchases;
drop policy if exists "purchases own insert" on public.purchases;
drop policy if exists "wallet own read" on public.wallet_transactions;
drop policy if exists "wallet own insert" on public.wallet_transactions;

-- policies
create policy "profiles read own" on public.profiles for select using (auth.uid() = id);
create policy "profiles update own" on public.profiles for update using (auth.uid() = id);
create policy "manga public read" on public.manga for select using (true);
create policy "manga auth write" on public.manga for insert with check (auth.role() = 'authenticated');
create policy "chapters public read" on public.chapters for select using (true);
create policy "chapters auth write" on public.chapters for insert with check (auth.role() = 'authenticated');
create policy "pages public read" on public.pages for select using (true);
create policy "pages auth write" on public.pages for insert with check (auth.role() = 'authenticated');
create policy "purchases own read" on public.purchases for select using (auth.uid() = user_id);
create policy "purchases own insert" on public.purchases for insert with check (auth.uid() = user_id);
create policy "wallet own read" on public.wallet_transactions for select using (auth.uid() = user_id);
create policy "wallet own insert" on public.wallet_transactions for insert with check (auth.uid() = user_id);

-- signup par profile auto-create (0 coins ke saath)
create or replace function public.handle_new_user()
returns trigger
language plpgsql
security definer set search_path = public
as $$
begin
  insert into public.profiles (id, email, coins)
  values (new.id, new.email, 0)
  on conflict (id) do nothing;
  return new;
end;
$$;
drop trigger if exists on_auth_user_created on auth.users;
create trigger on_auth_user_created
  after insert on auth.users
  for each row execute function public.handle_new_user();

-- storage buckets (covers + pages)
insert into storage.buckets (id, name, public)
values ('covers', 'covers', true), ('pages', 'pages', true)
on conflict (id) do nothing;
drop policy if exists "storage public read" on storage.objects;
